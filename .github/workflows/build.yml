name: Pinned build and baseline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.4.1
          cache: false
      - name: Install locked dependencies and verified Noir compiler
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix billboard/portal --ignore-scripts --no-audit --no-fund
          npm run bootstrap:noir
          npx --no-install playwright install --with-deps chromium
      - name: Build from clean generated directories
        run: |
          node -e "const fs = require('node:fs'); for (const p of ['billboard/target', 'billboard/portal/out', 'billboard/portal/cache', '.build/sdk', '.build/contracts-manifest.json']) fs.rmSync(p, {recursive:true, force:true}); fs.rmSync('apps/dist', {recursive:true, force:true});"
          npm run build
          node scripts/check-reproducibility.mjs snapshot "$RUNNER_TEMP/build-first.json"
      - name: Reject drift from committed generated consumers
        run: |
          git diff --exit-code HEAD -- apps/dist apps/src/billboard/billboard_artifact.json apps/src/billboard/private_fee_artifact.json apps/src/billboard/deploy/billboard_artifact.json apps/src/billboard/censor/billboard_artifact.json apps/src/billboard/portal_bytecode.txt apps/src/billboard/deploy/portal_bytecode.txt billboard/portal/out/BillboardPortal.sol/BillboardPortal.json shared/aztec_bundle.js plugins/adapter_artifact.json billboard/portal/out/PluginPortal.sol/PluginPortal.json
          test -z "$(git ls-files --others --exclude-standard -- apps/dist apps/src/billboard/billboard_artifact.json apps/src/billboard/private_fee_artifact.json apps/src/billboard/deploy/billboard_artifact.json apps/src/billboard/censor/billboard_artifact.json apps/src/billboard/portal_bytecode.txt apps/src/billboard/deploy/portal_bytecode.txt billboard/portal/out/BillboardPortal.sol/BillboardPortal.json shared/aztec_bundle.js plugins/adapter_artifact.json billboard/portal/out/PluginPortal.sol/PluginPortal.json)"
      - name: Rebuild and compare every recorded byte
        run: |
          node -e "const fs = require('node:fs'); for (const p of ['billboard/target', 'billboard/portal/out', 'billboard/portal/cache', '.build/sdk', '.build/contracts-manifest.json']) fs.rmSync(p, {recursive:true, force:true}); fs.rmSync('apps/dist', {recursive:true, force:true});"
          npm run build
          node scripts/check-reproducibility.mjs snapshot "$RUNNER_TEMP/build-second.json"
          node scripts/check-reproducibility.mjs compare "$RUNNER_TEMP/build-first.json" "$RUNNER_TEMP/build-second.json"
      - name: Artifact guards and baseline application tests
        run: |
          npm run check:artifacts
          node scripts/release-artifact-manifest.mjs write "$RUNNER_TEMP/release-artifacts.json"
          node scripts/release-artifact-manifest.mjs check "$RUNNER_TEMP/release-artifacts.json"
          node --test scripts/test-release-artifact-manifest.mjs scripts/test-frontend-provenance.mjs scripts/test-native-prover-pin.mjs scripts/test-txe-message-witness.mjs scripts/test-noir-test-batches.mjs
          npm run test:build
          NODE_BACKEND=js npm run test:plugins
          node --test scripts/test-a01-ci.mjs scripts/test-built-private-fees.mjs scripts/test-c05-browser-feed.mjs scripts/test-c05-moderation-client.mjs scripts/test-screening-history-client.mjs scripts/test-private-fee-config.mjs scripts/test-engine-private-fee.mjs
          NODE_BACKEND=js node --test scripts/test-private-fee-funding.mjs scripts/test-private-fee-funding-engine.mjs scripts/test-w03-proof-replacement.mjs scripts/test-application-nullifier.mjs scripts/test-w03-deploy-engine.mjs scripts/test-w03-deployment-journal.mjs scripts/test-w03-journal-backup.mjs scripts/test-w03-ethereum-journal.mjs scripts/test-w03-journal.mjs scripts/test-w02-cli-cache.mjs scripts/test-w02-cli-inputs.mjs scripts/test-w02-cli-session.mjs scripts/test-w02-session.mjs scripts/test-w02-wallet-ui.mjs scripts/test-w02-rpc.mjs scripts/test-wallet-backup.mjs
          npm run test:dependencies
          npm run test:noir
          npm run test:moderation
          node --test scripts/test-shell-baseline.mjs scripts/test-receipt-baseline.mjs scripts/test-c03-post-client.mjs scripts/test-w03-withdrawal-history.mjs
          node --test scripts/test-sdk-storage.mjs scripts/test-protocol-schema.mjs scripts/test-protocol-commitments.mjs
          node scripts/test-sdk-storage-browser.mjs
          node scripts/fixtures/noir-interface-v1/run.mjs
          node scripts/fixtures/solidity-interface-v1/run.mjs
          (cd billboard/portal && FOUNDRY_PROFILE=regression forge test --offline -vv)
          node scripts/test-w03-ethereum-anvil.mjs
          npm run test:sdk-browser
          npm run test:cli-sdk
          node scripts/run-bounded-browser-check.mjs scripts/test-w02-browser.mjs execution/evidence/T04/wallet-browser-ci.json
      - name: Model process isolation with disposable fixtures
        run: |
          docker pull docker.io/library/node@sha256:6dac556d980b7f0e5498d08f08cee0ca67798b4ad6c23964a9214920e67758d0
          node --test censor-daemon/model-runtime.test.mjs
