name: Rolling application release

on:
  pull_request:
    paths:
      - 'apps/rolling/**'
      - 'shared/rolling/**'
      - 'ops/**'
      - 'deploy/launch-ops/**'
      - 'scripts/rolling-public-server.mjs'
      - 'scripts/rolling-public-capacity.test.mjs'
      - 'scripts/release/**'
      - '.github/workflows/rolling-release.yml'
  workflow_run:
    workflows: ['Pinned build and baseline checks']
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rolling-release-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: false

jobs:
  focused-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Release gate, operations privacy and application components
        run: node scripts/release/checks.mjs

  release:
    # Only GitHub-hosted jobs run repository workflows. The public repo never
    # registers a persistent self-hosted runner on the application host.
    if: >-
      github.repository == 'zac-williamson/aztec_experiments' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
    needs: focused-checks
    environment: rolling-testnet-release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Obtain short-lived permission for the fixed release command
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ROLLING_RELEASE_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 1800
          role-session-name: rolling-release-${{ github.run_id }}
      - name: Run the installed gate and wait for its result
        shell: bash
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command --document-name RollingApplicationRelease --document-version 1 --instance-ids i-0a9b5b9ba55815cda --timeout-seconds 60 --query Command.CommandId --output text)
          test -n "$command_id"
          for attempt in $(seq 1 135); do
            # Initial propagation may return InvocationDoesNotExist. No command
            # output or private host logs are copied into public Actions logs.
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-0a9b5b9ba55815cda --query Status --output text 2>/dev/null || true)
            case "$status" in
              Success) echo 'Installed release gate passed.'; exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) echo "Installed release gate: $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo 'Release result unavailable within the wait budget; inspect private operations dashboard.'
          exit 1
