<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse boards</title><style>

  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
         max-width: 720px; margin: 0 auto; padding: 1rem; line-height: 1.5; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  .sub { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
  .small { font-size: 0.85rem; color: #aaa; }
  .small.muted { color: #777; }
  .small.warn { color: #d29922; }

  /* Pagination */
  .page { display: none; }
  .page.active { display: block; }
  .page.active > .card { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Nav bar (inline, bottom right of content) */
  .nav-bar { display: flex; align-items: center; gap: 0.75rem;
             justify-content: flex-end; padding: 0.5rem 0 1.5rem 0; }
  .nav-back { background: #333; color: #ccc; border: none; border-radius: 8px;
              padding: 0.5rem 0.8rem; cursor: pointer; font-size: 0.9rem;
              visibility: hidden; }
  .nav-back:hover { background: #444; }
  .nav-progress { font-size: 0.85rem; color: #888; font-variant-numeric: tabular-nums;
                  margin-right: auto; }
  .nav-next { background: #6c4bd6; color: #fff; border: none; border-radius: 8px;
              padding: 0.6rem 1.2rem; cursor: pointer; font-size: 1rem; font-weight: 600;
              min-width: 8rem; text-align: center; }
  .nav-next:hover { background: #5a3cc0; }
  .nav-next:disabled { background: #555; cursor: not-allowed; }
  .nav-next.working { background: #4a3a8a; }

  /* Cards & inputs */
  .card { border: 1px solid #333; border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem;
          background: rgba(127,127,127,0.05); }
  label { display: block; font-size: 0.85rem; margin: 0.75rem 0 0.25rem; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 0.55rem; font-size: 0.95rem;
          border-radius: 6px; border: 1px solid #444; background: inherit; color: inherit;
          font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  input.missing, textarea.missing, select.missing { border-color: #f85149; }
  .field-error { color: #f85149; font-size: 0.85rem; margin: 0.25rem 0; }
  button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible, textarea:focus-visible, h2[tabindex]:focus-visible { outline: 2px solid #58a6ff; outline-offset: 3px; }
  button { cursor: pointer; border: none; border-radius: 8px; padding: 0.7rem 1rem;
           font-size: 1rem; font-weight: 600; color: #fff; background: #6c4bd6; margin-top: 0.5rem; }
  button:hover { background: #5a3cc0; }
  button:disabled { background: #555; cursor: not-allowed; }
  button.secondary { background: #333; font-weight: 500; font-size: 0.9rem; }
  button.secondary:hover { background: #444; }
  button.working, .nav-next.working { opacity: 0.8; }

  /* Public identifiers and user text must fit narrow reading screens. */
  #boardConfiguration, #messages article { overflow-wrap: anywhere; }

  /* Wallet buttons */
  .wallet-btns { display: flex; flex-direction: column; gap: 0.6rem; }
  button.wallet-btn { background: #333; font-weight: 500; font-size: 0.9rem; }
  button.wallet-btn:hover { background: #444; }
  button.wallet-btn.loaded { background: #238636; }
  button.wallet-btn.loaded:hover { background: #2ea043; }
  button.wallet-btn.other { background: #3a6b3a; }
  button.wallet-btn.other:hover { background: #457a45; }
  .wallet-group { display: flex; flex-direction: column; gap: 0.3rem; }
  .wallet-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; color: #aaa; text-transform: uppercase; }
  .wallet-label small { font-weight: 400; text-transform: none; color: #777; font-size: 0.7rem; }
  .wallet-btn-row { display: flex; gap: 0.4rem; flex-wrap: wrap; align-items: center; }

  /* Status messages */
  .status-container { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.82rem; min-height: 1.5rem; margin-top: 0.75rem; max-height: 300px; overflow-y: auto; }
  .status { padding: 0.15rem 0; }
  .status.info { color: #aaa; }
  .status.success { color: #3fb950; }
  .status.error { color: #f85149; }
  .status.warn { color: #d29922; }
  .status.working { color: #58a6ff; }

  .spinner { display: inline-block; width: 0.7rem; height: 0.7rem; border: 2px solid #58a6ff;
             border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;
             margin-right: 0.4rem; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .ok { color: #3fb950; } .err { color: #f85149; } .muted { color: #888; }
  .ref { font-size: 0.78rem; color: #888; word-break: break-all; }
  a { color: #58a6ff; }
  hr { border: none; border-top: 1px solid #333; margin: 1rem 0; }
  code { background: rgba(127,127,127,0.15); padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.85rem; }

  /* Block monitor (top-right fixed indicator) */
  .block-monitor {
    position: fixed; top: 8px; right: 12px;
    font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: rgba(127,127,127,0.08); padding: 4px 10px; border-radius: 6px;
    z-index: 9999; pointer-events: none; color: #888;
    border: 1px solid rgba(127,127,127,0.15);
  }
  .block-monitor.ok { color: #3fb950; }
  .block-monitor.err { color: #f85149; }

  /* Countdown timer (page 3 of user app) */
  .countdown {
    font-size: 0.95rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 0.6rem 0.8rem; border-radius: 6px; margin-bottom: 0.75rem;
    font-variant-numeric: tabular-nums; text-align: center;
  }
  .countdown.ready { background: rgba(63,185,80,0.12); color: #3fb950; }
  .countdown.waiting { background: rgba(210,153,34,0.12); color: #d29922; }
  .countdown.warn { background: rgba(248,81,73,0.10); color: #d29922; }

  /* Billboard feed */
  .billboard-card { padding-bottom: 0.5rem; }
  .billboard-feed {
    display: flex; flex-direction: column; gap: 0.6rem;
    max-height: 840px; overflow-y: auto; padding-right: 0.3rem;
    margin-top: 0.5rem;
  }
  .billboard-feed::-webkit-scrollbar { width: 6px; }
  .billboard-feed::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  .billboard-post {
    padding: 0.8rem 1rem; border-radius: 10px;
    background: rgba(108,75,214,0.08); border: 1px solid rgba(108,75,214,0.18);
    font-size: 0.95rem; line-height: 1.55; word-wrap: break-word; overflow-wrap: break-word;
    animation: fadeIn 0.3s ease;
  }
  .billboard-post.new { animation: postIn 0.4s ease; }
  @keyframes postIn {
    from { opacity: 0; transform: translateY(-6px); background: rgba(108,75,214,0.20); }

  }
  .billboard-post-meta {
    font-size: 0.72rem; color: #888; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    margin-bottom: 0.35rem; display: flex; gap: 0.6rem; align-items: center;
  }
  .billboard-post-num {
    background: rgba(108,75,214,0.25); color: #b8a0ff; border-radius: 4px;
    padding: 0.05rem 0.4rem; font-weight: 600; font-size: 0.7rem;
  }
  .billboard-post-text { color: #2a2040; }
  .billboard-post.flagged {
    background: rgba(194,65,65,0.08); border: 1px solid rgba(194,65,65,0.25);
  }
  .billboard-post-text.flagged-text { color: #888; font-style: italic; }
  /* Censored posts (greyed out, only shown when user opts in) */
  .billboard-post.censored {
    background: rgba(127,127,127,0.06); border: 1px solid rgba(127,127,127,0.15);
    opacity: 0.6;
  }
  .billboard-post-text.censored-text { color: #777; font-style: italic; }
  .censored-divider {
    height: 1px; background: rgba(127,127,127,0.2); margin: 0.8rem 0;
  }
  .censored-toggle {
    text-align: center; font-size: 0.78rem; color: #888; cursor: pointer;
    padding: 0.6rem 0; margin-top: 0.4rem; text-decoration: underline;
  }
  .censored-toggle:hover { color: #aaa; }
  /* Moderation policy box */
  .policy-box {
    background: rgba(108,75,214,0.05); border: 1px solid rgba(108,75,214,0.15);
    border-radius: 10px; padding: 0.8rem 1rem; margin-bottom: 0.8rem;
  }
  .policy-box h3 { margin: 0 0 0.4rem 0; font-size: 0.85rem; color: #b8a0ff; }
  .policy-text {
    font-family: inherit; font-size: 0.82rem; line-height: 1.5; color: #555;
    white-space: pre-wrap; word-wrap: break-word; margin: 0;
  }
  /* Confirmation dialog for viewing censored posts */
  .censor-confirm-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
    z-index: 10000;
  }
  .censor-confirm-dialog {
    background: #1a1a2e; border: 1px solid #444; border-radius: 12px;
    padding: 1.5rem; max-width: 400px; width: 90%;
    color: #e0e0e0;
  }
  .censor-confirm-dialog h3 { margin: 0 0 0.5rem; font-size: 1.1rem; color: #fff; }
  .censor-confirm-dialog .small { color: #ccc; margin-bottom: 1rem; }
  .censor-confirm-buttons { display: flex; gap: 0.6rem; justify-content: flex-end; }
  .censor-confirm-buttons button { margin-top: 0; }
  /* Sudoku challenge */
  .sudoku-dialog { max-width: 420px; }
  .sudoku-grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 0;
    margin: 0.5rem auto 1rem;
    width: 360px;
    border: 2px solid #666;
    border-radius: 4px;
    background: #111;
  }
  .sudoku-cell {
    width: 40px; height: 40px;
    text-align: center;
    font-size: 1.1rem;
    font-family: monospace;
    border: 1px solid #333;
    background: #1a1a2e;
    color: #e0e0e0;
    outline: none;
    padding: 0;
  }
  .sudoku-cell.given {
    background: #2a2a4e;
    color: #fff;
    font-weight: 700;
  }
  .sudoku-cell:focus {
    background: #1e3a5f;
    box-shadow: inset 0 0 0 2px #4a9eff;
  }
  .sudoku-border-right { border-right: 2px solid #666 !important; }
  .sudoku-border-bottom { border-bottom: 2px solid #666 !important; }
  .sudoku-cell.sudoku-conflict {
    color: #c24141;
    background: rgba(194,65,65,0.15);
  }
  .sudoku-status { text-align: center; min-height: 1.5rem; margin-bottom: 0.5rem; }
  .sudoku-solved { color: #4ade80; font-weight: 600; font-size: 0.95rem; }
  .flagged-badge {
    background: rgba(194,65,65,0.3); color: #c24141; border-radius: 4px;
    padding: 0.05rem 0.4rem; font-weight: 600; font-size: 0.7rem;
  }
  .censor-response {
    margin-top: 0.4rem; padding: 0.4rem 0.6rem; border-radius: 6px;
    background: rgba(194,65,65,0.06); font-size: 0.85rem; color: #6a4040;
    border-left: 3px solid rgba(194,65,65,0.3);
  }
  .billboard-empty {
    text-align: center; color: #888; font-size: 0.9rem; padding: 2rem 0;
  }
  .billboard-loading {
    text-align: center; color: #888; font-size: 0.85rem; padding: 1rem 0;
  }
  .billboard-loading .spinner { width: 0.9rem; height: 0.9rem; }

.account-menu { position:fixed; top:1rem; right:1rem; z-index:30; background:#202020; border:1px solid #555; border-radius:.6rem; }
.account-menu summary { cursor:pointer; padding:.7rem 1rem; }
.account-menu-panel { position:absolute; right:0; top:100%; z-index:20; width:min(22rem,85vw); padding:1rem; background:#202020; border:1px solid #555; border-radius:.6rem; box-shadow:0 8px 24px #0006; }
.account-menu-panel button { display:block; width:100%; margin:.4rem 0; }

<script>
(function (root) {
  'use strict';
  const STORAGE_KEY='billboard.public-config.v1', MAX_BYTES=16384;
  const FIELD=21888242871839275222246405745257275088548364400416034343698204186575808495617n;
  function check(ok,message){if(!ok)throw new Error(message);}
  function exact(value,keys,optional=[]){
    check(value!==null&&typeof value==='object'&&!Array.isArray(value),'Expected a configuration object');
    check(Object.keys(value).every(k=>keys.includes(k)||optional.includes(k))&&keys.every(k=>Object.hasOwn(value,k)),'Unknown or missing configuration field');
  }
  function uint(value,bits,positive=false){check(typeof value==='string'&&/^(0|[1-9][0-9]*)$/.test(value)&&value.length<=78,'Expected canonical decimal string');const n=BigInt(value);check(n<(1n<<BigInt(bits))&&(!positive||n>0n),'Integer outside allowed range');return value;}
  function address(value,bytes){check(typeof value==='string'&&new RegExp('^0x[0-9a-f]{'+bytes*2+'}$').test(value),'Expected lowercase canonical address');check(BigInt(value)>0n&&(bytes!==32||BigInt(value)<FIELD),'Address outside allowed range');return value;}
  function endpoint(value){
    check(typeof value==='string'&&value.length>0&&value.length<=2048&&!/[\s\\]/.test(value),'Invalid public endpoint');
    let url;try{url=new URL(value);}catch{throw new Error('Invalid public endpoint');}
    check(['http:','https:'].includes(url.protocol)&&url.hostname&&!url.username&&!url.password&&!url.search&&!url.hash&&!value.includes('?')&&!value.includes('#'),'Endpoint must be HTTP(S) without credentials, query or fragment');return url.href;
  }
  function freeze(value){if(value&&typeof value==='object'){Object.values(value).forEach(freeze);Object.freeze(value);}return value;}
  function fee(value){
    if(value===null||value===undefined)return null;
    exact(value,['contractAddress','gasSettings']);const g=value.gasSettings;
    exact(g,['gasLimits','teardownGasLimits','maxFeesPerGas','maxPriorityFeesPerGas']);
    const out={};for(const name of Object.keys(g)){
      const gas=name==='gasLimits'||name==='teardownGasLimits',keys=gas?['daGas','l2Gas']:['feePerDaGas','feePerL2Gas'];exact(g[name],keys);out[name]=Object.fromEntries(keys.map(k=>[k,uint(g[name][k],gas?32:128)]));
    }
    const da=BigInt(out.gasLimits.daGas),l2=BigInt(out.gasLimits.l2Gas),fda=BigInt(out.maxFeesPerGas.feePerDaGas),fl2=BigInt(out.maxFeesPerGas.feePerL2Gas),maximum=da*fda+l2*fl2;
    check(da>0n&&l2>0n&&maximum>0n&&maximum<(1n<<128n)&&BigInt(out.teardownGasLimits.daGas)<=da&&BigInt(out.teardownGasLimits.l2Gas)<=l2&&BigInt(out.maxPriorityFeesPerGas.feePerDaGas)<=fda&&BigInt(out.maxPriorityFeesPerGas.feePerL2Gas)<=fl2,'Invalid private fee limits');
    return {contractAddress:address(value.contractAddress,32),gasSettings:out};
  }
  function remote(value){exact(value,['url']);const url=endpoint(value.url),u=new URL(url);check(u.protocol==='https:'||['localhost','127.0.0.1','[::1]'].includes(u.hostname),'Prover requires HTTPS');return {url};}
  function validate(value){
    exact(value,['schemaVersion','network','board'],['privateFee','remoteProver']);check(value.schemaVersion===1,'Unsupported configuration version');
    const n=value.network,b=value.board;exact(n,['nodeUrl','ethRpcUrl','chainId','rollupVersion','rollupAddress']);exact(b,['portalAddress','contractAddress']);
    return freeze({schemaVersion:1,network:{nodeUrl:endpoint(n.nodeUrl),ethRpcUrl:endpoint(n.ethRpcUrl),chainId:uint(n.chainId,64,true),rollupVersion:uint(n.rollupVersion,32,true),rollupAddress:address(n.rollupAddress,20)},board:{portalAddress:address(b.portalAddress,20),contractAddress:address(b.contractAddress,32)},privateFee:fee(value.privateFee),...(value.remoteProver===undefined?{}:{remoteProver:remote(value.remoteProver)})});
  }
  function parse(text){check(typeof text==='string'&&new TextEncoder().encode(text).length<=MAX_BYTES,'Configuration exceeds size limit');let value;try{value=JSON.parse(text);}catch{throw new Error('Invalid configuration JSON');}return validate(value);}
  function maximumFee(config){const f=validate(config).privateFee;if(!f)return null;const g=f.gasSettings;return (BigInt(g.gasLimits.daGas)*BigInt(g.maxFeesPerGas.feePerDaGas)+BigInt(g.gasLimits.l2Gas)*BigInt(g.maxFeesPerGas.feePerL2Gas)).toString();}
  function createStore(options={}){
    let storage=options.storage,eventTarget=options.eventTarget??root,accessError=null;
    if(!Object.hasOwn(options,'storage'))try{storage=root.localStorage;}catch{accessError='Public configuration storage is unavailable';}
    let revision=0,state;const listeners=new Set();
    function update(config,error,persisted){state=freeze({config,revision:++revision,error,persisted});for(const fn of listeners)try{fn(state);}catch{}return state;}
    function load(text,persisted){try{return update(text===null?null:parse(text),null,persisted);}catch{return update(null,'Stored public configuration is invalid; import it again',false);}}
    try{if(!storage)throw new Error();load(storage.getItem(STORAGE_KEY),true);}catch{update(null,accessError??'Public configuration storage is unavailable',false);}
    function onStorage(event){if(event.storageArea&&event.storageArea!==storage)return;if(event.key!==STORAGE_KEY&&event.key!==null)return;load(event.key===null?null:event.newValue,true);}
    eventTarget?.addEventListener?.('storage',onStorage);
    return Object.freeze({snapshot:()=>state,
      install(value){const config=validate(value);let error=null,persisted=true;try{storage.setItem(STORAGE_KEY,JSON.stringify(config));}catch{persisted=false;error='Configuration is active for this page only; storage is unavailable';}return update(config,error,persisted);},
      clear(){let error=null,persisted=true;try{storage.removeItem(STORAGE_KEY);}catch{persisted=false;error='Configuration cleared for this page only; saved storage could not be removed';}return update(null,error,persisted);},
      assertCurrent(snapshot){check(snapshot===state,'Board configuration changed; restart this operation');check(state.config!==null,'Import a board configuration first');return state.config;},
      subscribe(fn){check(typeof fn==='function','Subscriber must be a function');listeners.add(fn);return ()=>listeners.delete(fn);},
      destroy(){eventTarget?.removeEventListener?.('storage',onStorage);listeners.clear();}
    });
  }
  root.BillboardConfig=Object.freeze({STORAGE_KEY,MAX_BYTES,validate,parse,maximumFee,createStore});
})(globalThis);

</script>
<script>
(function(root){
  'use strict';
  function mount(container,store){
    const api=root.BillboardConfig,doc=container.ownerDocument;
    const panel=doc.createElement('section');panel.setAttribute('aria-label','Board configuration');
    function element(tag,text){const node=doc.createElement(tag);if(text)node.textContent=text;panel.append(node);return node;}
    element('h2','Board configuration');
    element('p','Import public connection settings for this board. Never paste a wallet backup, password, recovery claim or RPC API key. Endpoints can observe connection metadata; do not share URLs containing secret path tokens.');
    const summary=element('p'),status=element('p');status.setAttribute('role','status');
    const label=element('label','Public configuration JSON');const input=doc.createElement('textarea');input.rows=7;input.maxLength=api.MAX_BYTES;label.append(input);
    const fileLabel=element('label','Choose configuration file');const file=doc.createElement('input');file.type='file';file.accept='.json,application/json';fileLabel.append(file);
    function button(text,action){const b=element('button',text);b.type='button';b.addEventListener('click',action);return b;}
    let destroyed=false;
    const imported=button('Import configuration',()=>{try{store.install(api.parse(input.value));input.value='';status.textContent=store.snapshot().error??'Public configuration imported. Live network checks run when connecting.';}catch(error){status.textContent=error.message;}});
    file.addEventListener('change',async()=>{const chosen=file.files?.[0];if(!chosen)return;const snapshot=store.snapshot();imported.disabled=true;try{if(chosen.size>api.MAX_BYTES)throw new Error('Configuration exceeds size limit');const text=await chosen.text();if(destroyed)return;if(store.snapshot()!==snapshot)throw new Error('Configuration changed while reading file; select it again');store.install(api.parse(text));input.value='';status.textContent=store.snapshot().error??'Public configuration imported. Live network checks run when connecting.';}catch(error){if(!destroyed)status.textContent=error.message;}finally{if(!destroyed){imported.disabled=false;file.value='';}}});
    const exported=button('Export configuration',()=>{const {config}=store.snapshot();if(!config)return;const url=URL.createObjectURL(new Blob([JSON.stringify(config,null,2)+'\n'],{type:'application/json'}));const anchor=doc.createElement('a');anchor.href=url;anchor.download='board-public-config.json';anchor.click();setTimeout(()=>URL.revokeObjectURL(url),0);});
    button('Clear configuration',()=>{store.clear();input.value='';});
    function render(snapshot){const c=snapshot.config;exported.disabled=!c;
      summary.textContent=c?`Ethereum chain ${c.network.chainId}; rollup version ${c.network.rollupVersion}. Board ${c.board.contractAddress}. Portal ${c.board.portalAddress}. Node ${c.network.nodeUrl}. Ethereum RPC ${c.network.ethRpcUrl}. ${c.privateFee?`Private fee contract ${c.privateFee.contractAddress}. Reservation ceiling ${api.maximumFee(c)} Fee Juice base units per transaction. Unused reserved credit is returned privately.`:'Public reading only: private fee settings are missing; wallet actions are unavailable.'} Imported settings are not proof of live chain verification.`:'No board configuration selected. Import settings to connect.';
      status.textContent=snapshot.error??(snapshot.persisted?'Public settings are saved for this browser origin.':'');
    }
    const unsubscribe=store.subscribe(render);render(store.snapshot());container.append(panel);
    return {destroy(){destroyed=true;unsubscribe();panel.remove();}};
  }
  root.BillboardConfigUI=Object.freeze({mount});
})(globalThis);

</script>
<script>
// Public settings only. No network or wallet action occurs during bootstrap.
(function(root){
  root.loadHostedSettings=async function(){
    const response=await fetch('board-reader-config.json',{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(20000)});
    if(!response.ok)throw Error('Board settings unavailable');
    return root.BillboardConfig.parse(await response.text());
  };
  root.loadHostedBoard=async function(){
    const hosted=await root.loadHostedSettings();
    const networkId=[hosted.network.chainId,hosted.network.rollupAddress,hosted.network.rollupVersion].join(':');
    const match=location.hash.match(/^#network=([0-9]+:0x[0-9a-f]{40}:[0-9]+)&board=(0x[0-9a-f]{64})$/);
    if(location.hash&&(!match||match[1]!==networkId))throw Error('Invalid board or network link');
    const boardAddress=match?match[2]:hosted.board.contractAddress;
    const result=await root.BillboardPublic.connectPublicBoard({network:hosted.network,boardAddress,metadata:root.BillboardPublic.metadata,storage:root.BillboardPublic.browserPublicFeedStorage()});
    return {...result,config:root.BillboardConfig.validate({...result.config,privateFee:hosted.privateFee,...(boardAddress===hosted.board.contractAddress&&hosted.remoteProver?{remoteProver:hosted.remoteProver}:{})}),fragment:'network='+networkId+'&board='+boardAddress};
  };
  if(document.body?.hasAttribute('data-public-board-reader'))return;
  if(document.body?.hasAttribute('data-hosted-board')){
    // Page-local settings cannot inherit or overwrite another board's saved settings.
    root.billboardConfigStore=root.BillboardConfig.createStore({storage:{getItem:()=>null,setItem(){},removeItem(){}},eventTarget:{}});
    root.initializeHostedBoard=async function(initialize){
      const status=document.getElementById('setupStatus');status.textContent='Loading board…';
      try{
        const requestedHash=location.hash,result=await root.loadHostedBoard();
        if(location.hash!==requestedHash){location.reload();return;}
        const link=new URL(location.href);link.hash=result.fragment;history.replaceState(null,'',link);
        for(const anchor of document.querySelectorAll('[data-board-link]')){const target=new URL(anchor.href);target.hash=result.fragment;anchor.href=target.href;anchor.hidden=!result.config.privateFee&&target.pathname.split('/').pop()!=='feed.html';}
        root.addEventListener('hashchange',()=>location.reload(),{once:true});
        if(!result.config.privateFee){status.textContent='Posting and fee funding are not enabled for this board. You can still read messages.';return;}
        root.billboardConfigStore.install(result.config);
        status.textContent='Board ready. Connect your wallet to continue.';initialize();
      }catch{status.textContent='This board is unavailable for posting. Reload to try again.';}
    };
    return;
  }
  let storage;try{storage=root.localStorage;}catch{}
  root.billboardConfigStore=root.BillboardConfig.createStore({storage:storage||null,eventTarget:root});
  const mount=()=>{
    if(document.getElementById('deploymentManifest'))return;
    const container=document.createElement('div');container.id='boardConfiguration';container.className='card';
    document.body.prepend(container);root.BillboardConfigUI.mount(container,root.billboardConfigStore);
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount,{once:true});else mount();
})(globalThis);

</script>
<script>
(function(root){
  'use strict';
  // Pinned BB uses isolated shared WASM memory and module workers. This checks
  // prerequisites only: it neither loads proving assets nor guarantees a proof fits.
  const messages={INSECURE_CONTEXT:'Wallet actions require HTTPS or localhost.',SHARED_MEMORY_UNAVAILABLE:'Wallet actions require cross-origin isolation and shared memory.',WASM_UNAVAILABLE:'This browser cannot run the required WebAssembly features.',WORKER_UNAVAILABLE:'Browser workers are unavailable or blocked.',CRYPTO_UNAVAILABLE:'Browser cryptography is unavailable.',LOCKS_UNAVAILABLE:'Browser storage locks are unavailable.',OPFS_UNAVAILABLE:'Private browser file storage is unavailable or blocked. Wallet storage cannot start.',STORAGE_UNAVAILABLE:'Browser storage is unavailable or blocked.',READINESS_TIMEOUT:'Browser capability checks timed out.'};
  function failure(code){const error=new Error(messages[code]);error.code=code;return error;}
  function createChecker(env=root,{timeoutMs=5000}={}){
    let pending,success;
    function check(){
      if(success)return Promise.resolve(success);if(pending)return pending;
      pending=run().then(value=>{success=value;return value;}).finally(()=>{pending=null;});return pending;
    }
    async function run(){
      const cleanup=[];let stopped=false,timer;
      const name='billboard-readiness-'+Date.now()+'-'+Math.random().toString(36).slice(2);
      function guard(){if(stopped)throw failure('READINESS_TIMEOUT');}
      async function stage(code,fn){try{guard();return await fn();}catch(error){throw failure(error?.code==='READINESS_TIMEOUT'?'READINESS_TIMEOUT':code);}}
      const work=async()=>{
        if(env.isSecureContext!==true)throw failure('INSECURE_CONTEXT');
        if(env.crossOriginIsolated!==true||typeof env.SharedArrayBuffer!=='function')throw failure('SHARED_MEMORY_UNAVAILABLE');
        await stage('WASM_UNAVAILABLE',async()=>{
          await env.WebAssembly.instantiate(new Uint8Array([0,97,115,109,1,0,0,0]));guard();
          const memory=new env.WebAssembly.Memory({initial:1,maximum:1,shared:true});if(!(memory.buffer instanceof env.SharedArrayBuffer))throw Error();
        });
        await stage('CRYPTO_UNAVAILABLE',()=>env.crypto.subtle.digest('SHA-256',new Uint8Array([1])));
        await stage('LOCKS_UNAVAILABLE',()=>env.navigator.locks.request(name,{ifAvailable:true},lock=>{if(!lock)throw Error();}));
        await stage('WORKER_UNAVAILABLE',()=>new Promise((resolve,reject)=>{
          const url=env.URL.createObjectURL(new env.Blob(['self.onmessage=e=>self.postMessage(e.data)'],{type:'text/javascript'}));cleanup.push(()=>env.URL.revokeObjectURL(url));
          const worker=new env.Worker(url,{type:'module'});cleanup.push(()=>worker.terminate());
          worker.onmessage=event=>event.data===name?resolve():reject(Error());worker.onerror=()=>reject(Error());worker.onmessageerror=()=>reject(Error());worker.postMessage(name);
        }));
        await stage('OPFS_UNAVAILABLE',async()=>{
          const directory=await env.navigator.storage.getDirectory();guard();
          let writable;
          async function remove(){try{await directory.removeEntry(name);}catch{}}
          cleanup.push(()=>{void (async()=>{try{await writable?.abort();}catch{}await remove();})();});
          try{
            const file=await directory.getFileHandle(name,{create:true});
            if(stopped){await remove();guard();}
            writable=await file.createWritable();
            if(stopped){try{await writable.abort();}catch{}await remove();guard();}
            await writable.write(name);guard();await writable.close();writable=null;guard();
            const contents=await file.getFile();guard();if(await contents.text()!==name)throw Error();guard();
            await directory.removeEntry(name);
          }catch(error){try{await writable?.abort();}catch{}await remove();throw error;}
        });
        await stage('STORAGE_UNAVAILABLE',()=>new Promise((resolve,reject)=>{
          let db,transaction,deleted=false;
          function remove(){if(deleted)return null;deleted=true;return env.indexedDB.deleteDatabase(name);}
          cleanup.push(()=>{try{transaction?.abort();}catch{}try{db?.close();}catch{}try{remove();}catch{}});
          const request=env.indexedDB.open(name,1);
          request.onerror=()=>reject(Error());request.onblocked=()=>reject(Error());
          request.onupgradeneeded=()=>{try{request.result.createObjectStore('probe');}catch{reject(Error());}};
          request.onsuccess=()=>{
            db=request.result;if(stopped){db.close();try{env.indexedDB.deleteDatabase(name);}catch{}return;}
            try{
              transaction=db.transaction('probe','readwrite');const store=transaction.objectStore('probe');store.put(name,'key');const read=store.get('key');
              let matches=false;read.onsuccess=()=>{matches=read.result===name;};read.onerror=()=>reject(Error());
              transaction.onerror=()=>reject(Error());transaction.onabort=()=>reject(Error());transaction.oncomplete=()=>{
                db.close();if(!matches){reject(Error());return;}try{const deletion=remove();deletion.onsuccess=()=>resolve();deletion.onerror=()=>reject(Error());deletion.onblocked=()=>reject(Error());}catch{reject(Error());}
              };
            }catch{reject(Error());}
          };
        }));
        guard();return Object.freeze({ready:true,scope:'Browser prerequisites checked; proof performance and capacity are not guaranteed.'});
      };
      try{return await Promise.race([work(),new Promise((resolve,reject)=>{timer=env.setTimeout(()=>{stopped=true;reject(failure('READINESS_TIMEOUT'));},timeoutMs);})]);}
      finally{stopped=true;env.clearTimeout(timer);for(const dispose of cleanup.reverse())try{dispose();}catch{}}
    }
    return Object.freeze({check});
  }
  const checker=createChecker();root.BillboardReadiness=Object.freeze({check:checker.check,createChecker});
})(globalThis);

</script>
<script>
(function(root){
  'use strict';
  const ABI=['function MIN_DEPOSIT() view returns (uint256)','function MAX_DEPOSIT() view returns (uint256)','function L2_CONTRACT() view returns (bytes32)','function ROLLUP() view returns (address)','function INBOX() view returns (address)','function OUTBOX() view returns (address)','function VERSION() view returns (uint256)','function L1_CHAIN_ID() view returns (uint256)','function CONFIG_HASH() view returns (bytes32)'];
  const names=['MIN_DEPOSIT','MAX_DEPOSIT','L2_CONTRACT','ROLLUP','INBOX','OUTBOX','VERSION','L1_CHAIN_ID','CONFIG_HASH'];
  function failure(){return Object.assign(new Error('The configured portal, network or private fee contract could not be verified. Check the public board configuration before making a payment.'),{code:'BB_CONNECTION_VERIFICATION_FAILED'});}
  async function verify({sdk,ethers,config,privateFeeArtifact,verifyFee=true}={}){
    let provider;const deadline=Date.now()+20000;
    try{
      const selected=root.BillboardConfig.validate(config);
      if(typeof verifyFee!=='boolean')throw Error();
      const read=fn=>sdk.boundedTransactionRead(fn,deadline-Date.now());
      if(verifyFee){
        if(!selected.privateFee||!privateFeeArtifact)throw Error();
        const address=await read(()=>sdk.derivePrivateFeeAddress(privateFeeArtifact));
        if(address.toString()!==selected.privateFee.contractAddress)throw Error();
      }
      provider=new ethers.JsonRpcProvider(selected.network.ethRpcUrl);
      const node=sdk.createAztecNodeClient(selected.network.nodeUrl);
      const portal=new ethers.Contract(selected.board.portalAddress,ABI,provider);
      const [network,info,contracts,code,values]=await read(()=>Promise.all([
        provider.getNetwork(),node.getNodeInfo(),node.getL1ContractAddresses(),provider.getCode(selected.board.portalAddress),
        Promise.all(names.map(name=>portal[name]()))
      ]));
      const immutable=Object.fromEntries(names.map((name,index)=>[name,values[index]]));
      const same=(a,b)=>BigInt(a.toString())===BigInt(b);
      if(!same(network.chainId,selected.network.chainId)||!same(info.l1ChainId,selected.network.chainId)||!same(info.rollupVersion,selected.network.rollupVersion)||
         !same(contracts.rollupAddress,selected.network.rollupAddress)||!same(immutable.L2_CONTRACT,selected.board.contractAddress)||
         !same(immutable.ROLLUP,selected.network.rollupAddress)||!same(immutable.VERSION,selected.network.rollupVersion)||!same(immutable.L1_CHAIN_ID,selected.network.chainId)||
         !same(immutable.INBOX,contracts.inboxAddress.toString())||!same(immutable.OUTBOX,contracts.outboxAddress.toString()))throw Error();
      if(sdk.verifyPortalRuntime(code,sdk.portalRuntimeMetadata,immutable)!==true)throw Error();
      return Object.freeze({verified:true,privateFeeVerified:verifyFee,portalRuntimeVerified:true,scope:'Bundled portal runtime and configured public identities matched RPC responses; this is not independent cryptographic network verification.'});
    }catch{throw failure();}
    finally{try{provider?.destroy();}catch{}}
  }
  root.BillboardConnectionCheck=Object.freeze({verify});
})(globalThis);

</script>

let directory,networkId,count=0;
const el=id=>document.getElementById(id);
async function findBoards(){
 el('more').hidden=true;el('status').textContent='Finding boards…';
 try{
  let result;
  // A bounded batch keeps discovery resumable without an indexer service.
  for(let page=0;page<20;page++){
   result=await directory.next();
   for(const board of result.boards){
    const card=document.createElement('article');card.className='card';const link=document.createElement(board.ready?'a':'span');
    const url=new URL('feed.html',location.href);url.hash='network='+networkId+'&board='+board.address;if(board.ready)link.href=url.href;
    link.textContent='Board '+board.address.slice(0,10)+'…'+board.address.slice(-6);card.append(link);if(!board.ready){const status=document.createElement('p');status.textContent=board.unavailable?'This board is unavailable.':'Setup is not complete yet.';card.append(status);}el('boards').append(card);count++;
   }
   el('status').textContent=count+' board'+(count===1?'':'s')+' found. Searching…';
   if(result.complete)break;
  }
  el('more').hidden=result.complete;
  el('status').textContent=result.complete?(count?count+' board'+(count===1?'':'s')+' found.':'No compatible boards found.')+' Search complete through block '+result.block+'.':count+' boards found so far. More history remains to search.';
 }catch(error){if(error.code==='BB_DIRECTORY_REORG'){el('boards').replaceChildren();count=0;}el('status').textContent='Could not finish finding boards. Reload to start a new search. The list above may be incomplete.';}
}
