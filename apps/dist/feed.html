<script>
// Shared presentation of verified public board data. No wallet or SDK dependencies.
(function(root){
  const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;};
  function url(page,fragment=location.hash){const target=new URL(page,location.href);target.hash=fragment;if(target.origin===location.origin&&(location.pathname.endsWith('/censor.html')||new URL(location.href).searchParams.get('return')==='moderator')&&['feed.html','fee-juice.html','user.html'].includes(target.pathname.split('/').pop()))target.searchParams.set('return','moderator');return target;}
  function header({title='Message board',section='Read'}={}){
    const head=el('header',undefined,'site-header');head.id='siteHeader';
    const brand=el('a','Message boards','brand');brand.href='boards.html';
    const nav=el('nav');nav.setAttribute('aria-label','Main navigation');
    for(const [label,page]of [['Read','feed.html'],['Write','user.html']]){const link=el('a',label);link.href=url(page);link.dataset.boardLink='';if(label===section)link.setAttribute('aria-current','page');nav.append(link);}
    const share=el('button','Copy board link','secondary');share.type='button';share.dataset.copyBoardLink='';share.onclick=async()=>{const target=url('feed.html');target.search='';try{await navigator.clipboard.writeText(target.href);share.textContent='Link copied';}catch{share.textContent='Copy unavailable';}};nav.append(share);if(new URL(location.href).searchParams.get('return')==='moderator'){const back=el('a','Return to moderation');back.href=url('censor.html');nav.append(back);}
    const account=el('div');account.id='accountSlot';head.append(brand,nav,account);document.body.prepend(head);
    const notice=el('p','Testnet · Test funds only','testnet-notice');head.after(notice);
    document.querySelector('h1')?.replaceChildren(document.createTextNode(title));return head;
  }
  let identityVersion=0;
  function identity(config){
    const version=++identityVersion,address=config?.board?.contractAddress;
    for(const anchor of document.querySelectorAll('[data-board-link]')){const page=anchor.dataset.boardPage||anchor.getAttribute('href');if(page)anchor.dataset.boardPage=page;if(address)anchor.href=url(page,location.hash);else anchor.removeAttribute('href');}
    const share=document.querySelector('[data-copy-board-link]');if(share)share.disabled=!address;
    if(!address){const heading=document.querySelector('[data-board-title]');if(heading)heading.textContent='Message board';document.title='Message board';return;}
    const notice=document.querySelector('.testnet-notice');if(notice)notice.textContent=String(config.network.chainId)==='11155111'?'Testnet · Test funds only':String(config.network.chainId)==='1'?'Ethereum mainnet':'Ethereum network '+config.network.chainId;
    const name='Board '+address.slice(2,8);const heading=document.querySelector('[data-board-title]');if(heading)heading.textContent=name;
    document.title=name+' · Message board';
    root.BillboardCatalog?.load(config.network).then(labels=>{const label=labels.find(x=>x.address===address);if(version===identityVersion&&label&&heading){heading.textContent=label.name;document.title=label.name;}}).catch(()=>{});
  }
  function renderMessages(container,posts,{append=false,onModerate}={}){
    const previous=new Map([...container.querySelectorAll('article[data-post-id]')].map(node=>[node.dataset.postId,node]));
    const nodes=[];
    for(const post of posts){
      const signature=JSON.stringify([post.flagged&&!onModerate?null:post.text,post.flagged,post.flag?.reason,post.publishedAt,post.pluginReply,Boolean(onModerate)]);let article=previous.get(post.postId);
      if(!article||article.dataset.signature!==signature){
        article=el('article',undefined,'message');article.dataset.postId=post.postId;article.dataset.signature=signature;article.id='message-'+post.postId;
        const meta=el('div',undefined,'message-meta'),time=el('time');const seconds=Number(post.publishedAt);
        if(Number.isSafeInteger(seconds)&&seconds>0){const date=new Date(seconds*1000);time.dateTime=date.toISOString();time.textContent=date.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});}else time.textContent='Publication time unavailable';
        const link=el('a','Link');const target=url('feed.html');target.searchParams.set('message',post.postId);link.href=target;link.setAttribute('aria-label','Link to message '+post.orderIndex);
        if(post.pluginReply)meta.append(el('span','Bot reply'));meta.append(time,link);article.append(meta,el('p',post.flagged?'Message removed by moderator.':post.text,'message-text'));
        if(post.flagged){article.append(el('p','Reason: '+(post.flag?.reason||'No reason supplied'),'small'));if(onModerate){const original=el('details');original.append(el('summary','Show removed message'),el('p',post.text,'message-text'));article.append(original);}}
        if(onModerate&&!post.flagged){const button=el('button','Moderate','secondary');button.onclick=()=>onModerate(post);article.append(button);}
      }
      nodes.push(article);
    }
    if(append){for(const node of nodes)if(!previous.has(node.dataset.postId))container.append(node);}
    else {const active=document.activeElement,card=active?.closest('article[data-post-id]'),focusIndex=card?[...card.querySelectorAll('a,button,summary')].indexOf(active):-1;container.replaceChildren(...nodes);if(active?.isConnected)active.focus({preventScroll:true});else if(card){const replacement=nodes.find(node=>node.dataset.postId===card.dataset.postId);const target=replacement?.querySelectorAll('a,button,summary')[focusIndex]||replacement?.querySelector('a');target?.focus({preventScroll:true});}}
    if(!container.children.length)container.append(el('p','No messages yet. Be the first to write one.','empty-state'));
  }
  function rules(container,policies,participation){
    const text=policies?.at(-1)?.text;container.hidden=!text&&!participation;
    let body=container.querySelector('[data-rules-text]');if(!body){container.replaceChildren(el('summary','Board rules'));body=el('p',undefined,'policy-text');body.dataset.rulesText='';container.append(body);}body.textContent=text||'No written rules published.';
    let terms=container.querySelector('[data-participation]');if(!terms){terms=el('p',undefined,'small');terms.dataset.participation='';container.append(terms);}terms.hidden=!participation;
    if(participation){const eth=value=>{const digits=String(value).padStart(19,'0');return digits.slice(0,-18)+'.'+digits.slice(-18).replace(/0+$/,'');};
      terms.textContent='Refundable deposit: '+eth(participation.minDeposit)+'–'+eth(participation.maxDeposit)+' ETH. At the minimum deposit, one posting interval is '+participation.baseCooldown+' seconds; larger deposits shorten it. Save up to '+participation.maxSaveUp+' intervals for consecutive posts. A removal confirmed within '+participation.censorWindow+' seconds of publication under the same rules adds '+(Number(participation.kMultiplier)-1)+' posting intervals when your account next checks it.';
    }
  }
  function bindOperation(application,container){
    const status=el('p');status.setAttribute('role','status');status.setAttribute('aria-live','polite');
    const hint=el('p',undefined,'small');const pause=el('button','Pause and continue later','secondary');pause.onclick=()=>{if(application.requestPause()){pause.disabled=true;pause.textContent='Pausing…';}};const details=el('details');details.append(el('summary','Details'));
    const elapsed=el('p',undefined,'small'),history=el('ol');history.setAttribute('aria-label','Operation stages reached');let current=null;const showElapsed=()=>{elapsed.textContent=current?.startedAt?'Elapsed: '+Math.floor(((current.endedAt||Date.now())-current.startedAt)/1000)+' seconds':'';};const timer=setInterval(showElapsed,1000);
    const report=el('pre'),copy=el('button','Copy diagnostic report','secondary');copy.type='button';copy.onclick=async()=>{await navigator.clipboard.writeText(application.diagnosticReport());copy.textContent='Copied';};details.append(history,report,copy);container.replaceChildren(status,hint,elapsed,pause,details);
    const unsubscribe=application.subscribe(state=>{current=state;showElapsed();history.replaceChildren(...(state.history||[]).map(stage=>el('li',root.BillboardOperations?.stages[stage]||stage)));pause.hidden=!['bridge','settlement','screening'].includes(state.stage)||!['working','waiting'].includes(state.status);if(pause.hidden){pause.disabled=false;pause.textContent='Pause and continue later';}container.hidden=state.status==='idle';status.textContent=state.message;status.className=state.status==='failed'?'error':state.status==='complete'?'success':'';
      hint.textContent=state.stage==='bridge'?'Your payment is confirmed. Setup continues automatically when the network is ready.':state.stage==='queued'?'Your request is accepted. It starts when the board’s prover is free.':state.stage==='proving'?'Proof generation can take several minutes. '+(state.mode==='remote'?'Using this board’s prover.':'Using this device.') :state.stage==='settlement'?'Your withdrawal is recorded. This can take longer than posting; we will ask for the final wallet approval when it is ready.':'';
      report.textContent=application.diagnosticReport();copy.textContent='Copy diagnostic report';});return()=>{clearInterval(timer);unsubscribe();};
  }
  root.BillboardView=Object.freeze({header,identity,renderMessages,rules,bindOperation,url,element:el});
})(globalThis);

</script>
<script>
// Optional operator labels. Chain identity and addresses are still verified by the public reader.
(function(root){
 let request;
 async function load(network){
  request??=fetch('board-catalog.json',{cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(10000)}).then(async response=>{
   if(!response.ok)throw Error('Catalog unavailable');const data=await response.json();
   if(data.schemaVersion!==1||typeof data.network!=='string'||!Array.isArray(data.boards)||data.boards.length>1000)throw Error('Invalid catalog');
   for(const board of data.boards)if(!/^0x[0-9a-f]{64}$/.test(board.address)||typeof board.name!=='string'||board.name.length>100||typeof board.description!=='string'||board.description.length>500||!['current','retired'].includes(board.status))throw Error('Invalid board label');
   return data;
  });
  const data=await request;if(data.network!==[network.chainId,network.rollupAddress,network.rollupVersion].join(':'))return [];
  return data.boards.map(board=>Object.freeze({...board}));
 }

})(globalThis);

</script>
<script>
(function (root) {
  'use strict';
  const STORAGE_KEY='billboard.public-config.v1', MAX_BYTES=16384;
  const FIELD=21888242871839275222246405745257275088548364400416034343698204186575808495617n;
  function check(ok,message){if(!ok)throw new Error(message);}
  function exact(value,keys,optional=[]){
    check(value!==null&&typeof value==='object'&&!Array.isArray(value),'Expected a configuration object');
    check(Object.keys(value).every(k=>keys.includes(k)||optional.includes(k))&&keys.every(k=>Object.hasOwn(value,k)),'Unknown or missing configuration field');
  }
  function uint(value,bits,positive=false){check(typeof value==='string'&&/^(0|[1-9][0-9]*)$/.test(value)&&value.length<=78,'Expected canonical decimal string');const n=BigInt(value);check(n<(1n<<BigInt(bits))&&(!positive||n>0n),'Integer outside allowed range');return value;}
  function address(value,bytes){check(typeof value==='string'&&new RegExp('^0x[0-9a-f]{'+bytes*2+'}$').test(value),'Expected lowercase canonical address');check(BigInt(value)>0n&&(bytes!==32||BigInt(value)<FIELD),'Address outside allowed range');return value;}
  function endpoint(value){
    check(typeof value==='string'&&value.length>0&&value.length<=2048&&!/[\s\\]/.test(value),'Invalid public endpoint');
    let url;try{url=new URL(value);}catch{throw new Error('Invalid public endpoint');}
    check(['http:','https:'].includes(url.protocol)&&url.hostname&&!url.username&&!url.password&&!url.search&&!url.hash&&!value.includes('?')&&!value.includes('#'),'Endpoint must be HTTP(S) without credentials, query or fragment');return url.href;
  }
  function freeze(value){if(value&&typeof value==='object'){Object.values(value).forEach(freeze);Object.freeze(value);}return value;}
  function fee(value){
    if(value===null||value===undefined)return null;
    exact(value,['contractAddress','gasSettings']);const g=value.gasSettings;
    exact(g,['gasLimits','teardownGasLimits','maxFeesPerGas','maxPriorityFeesPerGas']);
    const out={};for(const name of Object.keys(g)){
      const gas=name==='gasLimits'||name==='teardownGasLimits',keys=gas?['daGas','l2Gas']:['feePerDaGas','feePerL2Gas'];exact(g[name],keys);out[name]=Object.fromEntries(keys.map(k=>[k,uint(g[name][k],gas?32:128)]));
    }
    const da=BigInt(out.gasLimits.daGas),l2=BigInt(out.gasLimits.l2Gas),fda=BigInt(out.maxFeesPerGas.feePerDaGas),fl2=BigInt(out.maxFeesPerGas.feePerL2Gas),maximum=da*fda+l2*fl2;
    check(da>0n&&l2>0n&&maximum>0n&&maximum<(1n<<128n)&&BigInt(out.teardownGasLimits.daGas)<=da&&BigInt(out.teardownGasLimits.l2Gas)<=l2&&BigInt(out.maxPriorityFeesPerGas.feePerDaGas)<=fda&&BigInt(out.maxPriorityFeesPerGas.feePerL2Gas)<=fl2,'Invalid private fee limits');

  }

  function validate(value){
    exact(value,['schemaVersion','network','board'],['privateFee','remoteProver']);check(value.schemaVersion===1,'Unsupported configuration version');
    const n=value.network,b=value.board;exact(n,['nodeUrl','ethRpcUrl','chainId','rollupVersion','rollupAddress']);exact(b,['portalAddress','contractAddress']);
    return freeze({schemaVersion:1,network:{nodeUrl:endpoint(n.nodeUrl),ethRpcUrl:endpoint(n.ethRpcUrl),chainId:uint(n.chainId,64,true),rollupVersion:uint(n.rollupVersion,32,true),rollupAddress:address(n.rollupAddress,20)},board:{portalAddress:address(b.portalAddress,20),contractAddress:address(b.contractAddress,32)},privateFee:fee(value.privateFee),...(value.remoteProver===undefined?{}:{remoteProver:remote(value.remoteProver)})});
  }
  function parse(text){check(typeof text==='string'&&new TextEncoder().encode(text).length<=MAX_BYTES,'Configuration exceeds size limit');let value;try{value=JSON.parse(text);}catch{throw new Error('Invalid configuration JSON');}return validate(value);}
  function maximumFee(config){const f=validate(config).privateFee;if(!f)return null;const g=f.gasSettings;return (BigInt(g.gasLimits.daGas)*BigInt(g.maxFeesPerGas.feePerDaGas)+BigInt(g.gasLimits.l2Gas)*BigInt(g.maxFeesPerGas.feePerL2Gas)).toString();}
  function createStore(options={}){
    const pageOnly=options.persistence==='page';
    let storage=options.storage,eventTarget=options.eventTarget??root,accessError=null;

    function load(text,persisted){try{return update(text===null?null:parse(text),null,persisted);}catch{return update(null,'Stored public configuration is invalid; import it again',false);}}
    try{if(pageOnly)update(null,null,false);else {if(!storage)throw new Error();load(storage.getItem(STORAGE_KEY),true);}}catch{update(null,accessError??'Public configuration storage is unavailable',false);}
    function onStorage(event){if(event.storageArea&&event.storageArea!==storage)return;if(event.key!==STORAGE_KEY&&event.key!==null)return;load(event.key===null?null:event.newValue,true);}

    return Object.freeze({snapshot:()=>state,
      install(value){const config=validate(value);if(pageOnly)return update(config,null,false);let error=null,persisted=true;try{storage.setItem(STORAGE_KEY,JSON.stringify(config));}catch{persisted=false;error='Configuration is active for this page only; storage is unavailable';}return update(config,error,persisted);},
      clear(){if(pageOnly)return update(null,null,false);let error=null,persisted=true;try{storage.removeItem(STORAGE_KEY);}catch{persisted=false;error='Configuration cleared for this page only; saved storage could not be removed';}return update(null,error,persisted);},
      assertCurrent(snapshot){check(snapshot===state,'Board configuration changed; restart this operation');check(state.config!==null,'Import a board configuration first');return state.config;},
      subscribe(fn){check(typeof fn==='function','Subscriber must be a function');listeners.add(fn);return ()=>listeners.delete(fn);},
      destroy(){eventTarget?.removeEventListener?.('storage',onStorage);listeners.clear();}
    });
  }
  root.BillboardConfig=Object.freeze({STORAGE_KEY,MAX_BYTES,validate,parse,maximumFee,createStore});
})(globalThis);

</script>
<script>
(function(root){
  'use strict';

    const label=element('label','Public configuration JSON');const input=doc.createElement('textarea');input.rows=7;input.maxLength=api.MAX_BYTES;label.append(input);
    const advanced=doc.createElement('details'),advancedTitle=doc.createElement('summary');advancedTitle.textContent='Advanced connection settings';advanced.append(advancedTitle,label);panel.append(advanced);

<script>
// Public settings only. No network or wallet action occurs during bootstrap.
(function(root){
  root.loadHostedSettings=async function(){
    const response=await fetch('board-reader-config.json',{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(20000)});
    if(!response.ok)throw Error('Board settings unavailable');
    return root.BillboardConfig.parse(await response.text());
  };
  root.loadHostedBoard=async function(link){
    const explicit=link!==undefined;let fragment;try{const parsed=explicit?new URL(link):new URL(location.href);if(explicit&&(!['https:','http:'].includes(parsed.protocol)||!parsed.hash))throw Error();fragment=parsed.hash;}catch{throw Object.assign(Error('Invalid board link'),{code:'BB_BOARD_LINK_INVALID'});}
    const hosted=await root.loadHostedSettings();
    const networkId=[hosted.network.chainId,hosted.network.rollupAddress,hosted.network.rollupVersion].join(':');
    const match=fragment.match(/^#network=([0-9]+:0x[0-9a-f]{40}:[0-9]+)&board=(0x[0-9a-f]{64})$/);
    if(fragment&&!match)throw Object.assign(Error('Invalid board link'),{code:'BB_BOARD_LINK_INVALID'});
    if(match&&match[1]!==networkId)throw Object.assign(Error('Unsupported network'),{code:'BB_BOARD_NETWORK_UNSUPPORTED'});
    const boardAddress=match?match[2]:hosted.board.contractAddress;
    const result=await root.BillboardPublic.connectPublicBoard({network:hosted.network,boardAddress,metadata:root.BillboardPublic.metadata,storage:root.BillboardPublic.browserPublicFeedStorage()});
    return {...result,config:root.BillboardConfig.validate({...result.config,privateFee:hosted.privateFee,...(boardAddress===hosted.board.contractAddress&&hosted.remoteProver?{remoteProver:hosted.remoteProver}:{})}),fragment:'network='+networkId+'&board='+boardAddress};
  };
  root.boardConnectionFailure=error=>({BB_BOARD_LINK_INVALID:{message:'This board link is incomplete or invalid. Choose a board from the directory.',retry:false},BB_BOARD_NETWORK_UNSUPPORTED:{message:'This site does not serve the network in that link. Open it on the board operator’s site.',retry:false},BB_BOARD_INCOMPATIBLE:{message:'This board uses a different contract version. Ask its operator for the matching app.',retry:false},BB_BOARD_NOT_FOUND:{message:'No board was found at this address. Check the link with its operator.',retry:false}}[error?.code]||{message:'The board could not be reached. Your account and messages are unchanged. Try again.',retry:true});
  if(document.body?.hasAttribute('data-public-board-reader'))return;
  if(document.body?.hasAttribute('data-hosted-board')){
    // Page-local settings cannot inherit or overwrite another board's saved settings.
    root.billboardConfigStore=root.BillboardConfig.createStore({persistence:'page'});
    root.initializeHostedBoard=async function(initialize){
      const status=document.getElementById('setupStatus');status.textContent='Loading board…';
      try{
        const requestedHash=location.hash,result=await root.loadHostedBoard();
        if(location.hash!==requestedHash){location.reload();return;}
        const link=new URL(location.href);link.hash=result.fragment;history.replaceState(null,'',link);
        for(const anchor of document.querySelectorAll('[data-board-link]')){const target=new URL(anchor.href);target.hash=result.fragment;anchor.href=target.href;anchor.hidden=!result.config.privateFee&&target.pathname.split('/').pop()!=='feed.html';}
        root.addEventListener('hashchange',()=>location.reload(),{once:true});
        if(!result.config.privateFee){status.textContent='Posting and fee funding are not enabled for this board. You can still read messages.';return;}
        root.billboardConfigStore.install(result.config);
        status.textContent='Board ready. Connect your wallet to continue.';initialize();
      }catch(error){const failure=root.boardConnectionFailure(error);status.textContent=failure.message;if(failure.retry){const retry=document.createElement('button');retry.className='secondary';retry.textContent='Try again';retry.onclick=()=>root.initializeHostedBoard(initialize);status.append(retry);}}
    };
    return;
  }
  let storage;try{storage=root.localStorage;}catch{}
  const moderatorPage=document.body?.hasAttribute('data-moderator-board');
  const selectedFragment=c=>'#network='+[c.network.chainId,c.network.rollupAddress,c.network.rollupVersion].join(':')+'&board='+c.board.contractAddress;
  root.rememberSelectedBoard=function(config){config=root.BillboardConfig.validate(config);history.replaceState({...history.state,billboardSelectedConfiguration:config},'',selectedFragment(config));};
  root.forgetSelectedBoard=function(){const state={...history.state,billboardSelectedConfiguration:null};history.replaceState(state,'',location.pathname+location.search);};
  root.reloadSelectedBoard=async function(){
    const selected=root.billboardConfigStore.snapshot(),config=root.BillboardConfig.validate(selected.config);
    await root.BillboardAccount.endSession();
    root.billboardConfigStore.assertCurrent(selected);root.rememberSelectedBoard(config);
    location.reload();
  };
  const incomingModerator=moderatorPage&&!!location.hash;
  root.billboardConfigStore=root.BillboardConfig.createStore({storage:storage||null,persistence:incomingModerator||(moderatorPage&&Object.hasOwn(history.state??{},'billboardSelectedConfiguration'))?'page':'device',eventTarget:root});
  root.initializeSelectedBoard=async function(initialize){
    if(!incomingModerator){initialize();return;}
    const navigation=history.state?.billboardSelectedConfiguration;
    if(navigation){try{const config=root.BillboardConfig.validate(navigation);if(selectedFragment(config)===location.hash){root.billboardConfigStore.install(config);initialize();return;}}catch{}}
    const requested=location.href,before=root.billboardConfigStore.snapshot(),status=document.getElementById('setupStatus');status.textContent='Loading the selected board…';
    try{const result=await root.loadHostedBoard(requested);
      if(location.href!==requested||root.billboardConfigStore.snapshot().revision!==before.revision)return;
      root.billboardConfigStore.install(result.config);status.textContent='';initialize();
    }catch(error){if(location.href!==requested||root.billboardConfigStore.snapshot().revision!==before.revision)return;const failure=root.boardConnectionFailure(error);status.textContent=failure.message;if(failure.retry){const retry=document.createElement('button');retry.textContent='Try again';retry.onclick=()=>root.initializeSelectedBoard(initialize);status.append(retry);}}
  };
  if(document.body?.hasAttribute('data-moderator-board'))root.addEventListener('hashchange',()=>location.reload());
  const mount=()=>{
    if(document.getElementById('deploymentManifest'))return;
    const container=document.createElement('div');container.id='boardConfiguration';container.className='card';
    (document.getElementById('boardSelection')||document.querySelector('main')||document.body).prepend(container);root.BillboardConfigUI.mount(container,root.billboardConfigStore);
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount,{once:true});else mount();
})(globalThis);

</script>
<script>
(function(root){
  'use strict';
  // Pinned BB uses isolated shared WASM memory and module workers. This checks
  // prerequisites only: it neither loads proving assets nor guarantees a proof fits.
  const messages={INSECURE_CONTEXT:'Wallet actions require HTTPS or localhost.',SHARED_MEMORY_UNAVAILABLE:'Wallet actions require cross-origin isolation and shared memory.',WASM_UNAVAILABLE:'This browser cannot run the required WebAssembly features.',WORKER_UNAVAILABLE:'Browser workers are unavailable or blocked.',CRYPTO_UNAVAILABLE:'Browser cryptography is unavailable.',LOCKS_UNAVAILABLE:'Browser storage locks are unavailable.',OPFS_UNAVAILABLE:'Private browser file storage is unavailable or blocked. Wallet storage cannot start.',STORAGE_UNAVAILABLE:'Browser storage is unavailable or blocked.',READINESS_TIMEOUT:'Browser capability checks timed out.'};
  function failure(code){const error=new Error(messages[code]);error.code=code;return error;}
  function createChecker(env=root,{timeoutMs=5000}={}){
    let pending,success;
    function check(){
      if(success)return Promise.resolve(success);if(pending)return pending;
      pending=run().then(value=>{success=value;return value;}).finally(()=>{pending=null;});return pending;
    }
    async function run(){
      const cleanup=[];let stopped=false,timer;
      const name='billboard-readiness-'+Date.now()+'-'+Math.random().toString(36).slice(2);
      function guard(){if(stopped)throw failure('READINESS_TIMEOUT');}
      async function stage(code,fn){try{guard();return await fn();}catch(error){throw failure(error?.code==='READINESS_TIMEOUT'?'READINESS_TIMEOUT':code);}}
      const work=async()=>{
        if(env.isSecureContext!==true)throw failure('INSECURE_CONTEXT');
        if(env.crossOriginIsolated!==true||typeof env.SharedArrayBuffer!=='function')throw failure('SHARED_MEMORY_UNAVAILABLE');
        await stage('WASM_UNAVAILABLE',async()=>{
          await env.WebAssembly.instantiate(new Uint8Array([0,97,115,109,1,0,0,0]));guard();
          const memory=new env.WebAssembly.Memory({initial:1,maximum:1,shared:true});if(!(memory.buffer instanceof env.SharedArrayBuffer))throw Error();
        });
        await stage('CRYPTO_UNAVAILABLE',()=>env.crypto.subtle.digest('SHA-256',new Uint8Array([1])));
        await stage('LOCKS_UNAVAILABLE',()=>env.navigator.locks.request(name,{ifAvailable:true},lock=>{if(!lock)throw Error();}));
        await stage('WORKER_UNAVAILABLE',()=>new Promise((resolve,reject)=>{
          const url=env.URL.createObjectURL(new env.Blob(['self.onmessage=e=>self.postMessage(e.data)'],{type:'text/javascript'}));cleanup.push(()=>env.URL.revokeObjectURL(url));
          const worker=new env.Worker(url,{type:'module'});cleanup.push(()=>worker.terminate());
          worker.onmessage=event=>event.data===name?resolve():reject(Error());worker.onerror=()=>reject(Error());worker.onmessageerror=()=>reject(Error());worker.postMessage(name);
        }));
        await stage('OPFS_UNAVAILABLE',async()=>{
          const directory=await env.navigator.storage.getDirectory();guard();
          let writable;
          async function remove(){try{await directory.removeEntry(name);}catch{}}
          cleanup.push(()=>{void (async()=>{try{await writable?.abort();}catch{}await remove();})();});
          try{
            const file=await directory.getFileHandle(name,{create:true});
            if(stopped){await remove();guard();}
            writable=await file.createWritable();
            if(stopped){try{await writable.abort();}catch{}await remove();guard();}
            await writable.write(name);guard();await writable.close();writable=null;guard();
            const contents=await file.getFile();guard();if(await contents.text()!==name)throw Error();guard();
            await directory.removeEntry(name);
          }catch(error){try{await writable?.abort();}catch{}await remove();throw error;}
        });
        await stage('STORAGE_UNAVAILABLE',()=>new Promise((resolve,reject)=>{
          let db,transaction,deleted=false;
          function remove(){if(deleted)return null;deleted=true;return env.indexedDB.deleteDatabase(name);}
          cleanup.push(()=>{try{transaction?.abort();}catch{}try{db?.close();}catch{}try{remove();}catch{}});
          const request=env.indexedDB.open(name,1);
          request.onerror=()=>reject(Error());request.onblocked=()=>reject(Error());
          request.onupgradeneeded=()=>{try{request.result.createObjectStore('probe');}catch{reject(Error());}};
          request.onsuccess=()=>{
            db=request.result;if(stopped){db.close();try{env.indexedDB.deleteDatabase(name);}catch{}return;}
            try{
              transaction=db.transaction('probe','readwrite');const store=transaction.objectStore('probe');store.put(name,'key');const read=store.get('key');
              let matches=false;read.onsuccess=()=>{matches=read.result===name;};read.onerror=()=>reject(Error());
              transaction.onerror=()=>reject(Error());transaction.onabort=()=>reject(Error());transaction.oncomplete=()=>{
                db.close();if(!matches){reject(Error());return;}try{const deletion=remove();deletion.onsuccess=()=>resolve();deletion.onerror=()=>reject(Error());deletion.onblocked=()=>reject(Error());}catch{reject(Error());}
              };
            }catch{reject(Error());}
          };
        }));
        guard();return Object.freeze({ready:true,scope:'Browser prerequisites checked; proof performance and capacity are not guaranteed.'});
      };
      try{return await Promise.race([work(),new Promise((resolve,reject)=>{timer=env.setTimeout(()=>{stopped=true;reject(failure('READINESS_TIMEOUT'));},timeoutMs);})]);}
      finally{stopped=true;env.clearTimeout(timer);for(const dispose of cleanup.reverse())try{dispose();}catch{}}
    }
    return Object.freeze({check});
  }
  const checker=createChecker();root.BillboardReadiness=Object.freeze({check:checker.check,createChecker});
})(globalThis);

</script>
<script>
(function(root){
  'use strict';
  const ABI=['function MIN_DEPOSIT() view returns (uint256)','function MAX_DEPOSIT() view returns (uint256)','function L2_CONTRACT() view returns (bytes32)','function ROLLUP() view returns (address)','function INBOX() view returns (address)','function OUTBOX() view returns (address)','function VERSION() view returns (uint256)','function L1_CHAIN_ID() view returns (uint256)','function CONFIG_HASH() view returns (bytes32)'];
  const names=['MIN_DEPOSIT','MAX_DEPOSIT','L2_CONTRACT','ROLLUP','INBOX','OUTBOX','VERSION','L1_CHAIN_ID','CONFIG_HASH'];
  function failure(){return Object.assign(new Error('The configured portal, network or private fee contract could not be verified. Check the public board configuration before making a payment.'),{code:'BB_CONNECTION_VERIFICATION_FAILED'});}
  async function verify({sdk,ethers,config,privateFeeArtifact,verifyFee=true}={}){
    let provider;const deadline=Date.now()+20000;
    try{
      const selected=root.BillboardConfig.validate(config);
      if(typeof verifyFee!=='boolean')throw Error();
      const read=fn=>sdk.boundedTransactionRead(fn,deadline-Date.now());
      if(verifyFee){
        if(!selected.privateFee||!privateFeeArtifact)throw Error();
        const address=await read(()=>sdk.derivePrivateFeeAddress(privateFeeArtifact));
        if(address.toString()!==selected.privateFee.contractAddress)throw Error();
      }
      provider=new ethers.JsonRpcProvider(selected.network.ethRpcUrl);
      const node=sdk.createAztecNodeClient(selected.network.nodeUrl);
      const portal=new ethers.Contract(selected.board.portalAddress,ABI,provider);
      const [network,info,contracts,code,values]=await read(()=>Promise.all([
        provider.getNetwork(),node.getNodeInfo(),node.getL1ContractAddresses(),provider.getCode(selected.board.portalAddress),
        Promise.all(names.map(name=>portal[name]()))
      ]));
      const immutable=Object.fromEntries(names.map((name,index)=>[name,values[index]]));
      const same=(a,b)=>BigInt(a.toString())===BigInt(b);
      if(!same(network.chainId,selected.network.chainId)||!same(info.l1ChainId,selected.network.chainId)||!same(info.rollupVersion,selected.network.rollupVersion)||
         !same(contracts.rollupAddress,selected.network.rollupAddress)||!same(immutable.L2_CONTRACT,selected.board.contractAddress)||
         !same(immutable.ROLLUP,selected.network.rollupAddress)||!same(immutable.VERSION,selected.network.rollupVersion)||!same(immutable.L1_CHAIN_ID,selected.network.chainId)||
         !same(immutable.INBOX,contracts.inboxAddress.toString())||!same(immutable.OUTBOX,contracts.outboxAddress.toString()))throw Error();
      if(sdk.verifyPortalRuntime(code,sdk.portalRuntimeMetadata,immutable)!==true)throw Error();
      return Object.freeze({verified:true,privateFeeVerified:verifyFee,portalRuntimeVerified:true,scope:'Bundled portal runtime and configured public identities matched RPC responses; this is not independent cryptographic network verification.'});
    }catch{throw failure();}
    finally{try{provider?.destroy();}catch{}}
  }
  root.BillboardConnectionCheck=Object.freeze({verify});
})(globalThis);

</script>
<main><h1 data-board-title>Message board</h1><p class="sub">Read the conversation. No wallet needed.</p><p id="availability" class="small"></p><details id="boardRules" class="rules" hidden><summary>Board rules</summary><p data-rules-text></p></details><p id="status" role="status">Loading messages…</p><button id="connect" hidden>Try again</button><button id="refresh" class="secondary" hidden>Show latest messages</button><div id="messages"></div><button id="more" class="secondary" hidden>Older messages</button><p class="small">Messages are public. Moderation hides messages here; it cannot erase blockchain history.</p></main><script src="public-feed.js"></script><script>
const view=BillboardView,element=id=>document.getElementById(id);
view.header({section:'Read'});
let connection=null,cursor=null,busy=false,generation=0,signature='',older=false,targetResolved=false,historyComplete=false;
const target=new URL(location.href).searchParams.get('message');
function refreshFailed(error){
 if(error?.code==='PUBLIC_FEED_CONFLICT'){connection=null;busy=false;element('more').hidden=true;element('refresh').hidden=true;}
 element('connect').hidden=false;element('status').textContent='Messages could not be updated. Your displayed messages are still available. Try again to reopen the board.';
}
async function refresh(append=false){
 if(busy||!connection)return;busy=true;const selected=connection;
 try{
  let progress;if(!append)progress=await selected.feed.sync();
  const page=await selected.feed.page({limit:50,cursor:append?cursor:null});if(connection!==selected)return;
  older=append||false;if(progress)historyComplete=progress.complete;cursor=page.nextCursor;view.renderMessages(element('messages'),page.posts,{append});view.rules(element('boardRules'),page.policies,selected.participation);if(!append)signature=JSON.stringify(page.posts);
  element('more').hidden=!cursor;element('refresh').hidden=true;element('status').textContent=progress&&!progress.complete?'Loading message history…':'';
  if(target&&!targetResolved){const found=document.getElementById('message-'+target);if(found){targetResolved=true;found.tabIndex=-1;found.focus({preventScroll:true});found.scrollIntoView({block:'center'});}else if(!cursor&&historyComplete)element('status').textContent='This message is not available on this board.';}
  if(progress&&!progress.complete)setTimeout(()=>{if(connection===selected)refresh();},1000);
  else if(target&&!targetResolved&&!document.getElementById('message-'+target)&&cursor)setTimeout(()=>{if(connection===selected)refresh(true);},0);
 }catch(error){if(connection!==selected)return;refreshFailed(error);}
 finally{if(connection===selected)busy=false;}
}
async function openBoard(){
 const selected=++generation;view.identity(null);element('boardRules').hidden=true;element('availability').textContent='';element('more').hidden=true;element('refresh').hidden=true;connection=null;cursor=null;busy=false;older=false;targetResolved=false;signature='';historyComplete=false;element('messages').replaceChildren();element('connect').hidden=true;element('status').textContent='Loading messages…';
 try{const result=await loadHostedBoard();if(selected!==generation)return;connection=result;const canonical=new URL(location.href);canonical.hash=result.fragment;history.replaceState(null,'',canonical);view.identity(result.config);element('availability').textContent=result.config.privateFee?'':'This board is open for reading. Posting is not enabled by its operator.';await refresh();}
 catch(error){if(selected!==generation)return;const failure=boardConnectionFailure(error);element('status').textContent=failure.message;element('connect').hidden=!failure.retry;}
}
element('connect').onclick=openBoard;element('more').onclick=()=>refresh(true);element('refresh').onclick=()=>refresh();window.addEventListener('hashchange',openBoard);
setInterval(async()=>{
 if(!connection||busy||document.hidden||older)return;busy=true;const selected=connection;
 try{await selected.feed.sync();const page=await selected.feed.page({limit:50});if(connection!==selected)return;
   if(JSON.stringify(page.posts)!==signature){element('refresh').hidden=false;element('more').hidden=true;}
 }catch(error){if(connection===selected)refreshFailed(error);}
 finally{if(connection===selected)busy=false;}
},15000);
openBoard();
